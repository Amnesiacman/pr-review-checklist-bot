[project]
name = "pr-review-checklist-bot"
version = "0.1.0"
requires-python = ">=3.10"
description = "Generate PR review checklist based on changed files"

[project.scripts]
pr-review-checklist-bot = "pr_review_checklist_bot.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
